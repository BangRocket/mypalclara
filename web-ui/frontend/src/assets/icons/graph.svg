<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="white">
  <!-- Top node -->
  <rect x="6" y="1" width="4" height="1"/>
  <rect x="5" y="2" width="6" height="2"/>
  <rect x="6" y="4" width="4" height="1"/>
  <!-- Line from top to bottom-left -->
  <rect x="5" y="5" width="1" height="1"/>
  <rect x="4" y="6" width="1" height="1"/>
  <rect x="3" y="7" width="1" height="1"/>
  <!-- Line from top to bottom-right -->
  <rect x="10" y="5" width="1" height="1"/>
  <rect x="11" y="6" width="1" height="1"/>
  <rect x="12" y="7" width="1" height="1"/>
  <!-- Bottom-left node -->
  <rect x="1" y="8" width="4" height="1"/>
  <rect x="0" y="9" width="6" height="2"/>
  <rect x="1" y="11" width="4" height="1"/>
  <!-- Bottom-right node -->
  <rect x="11" y="8" width="4" height="1"/>
  <rect x="10" y="9" width="6" height="2"/>
  <rect x="11" y="11" width="4" height="1"/>
  <!-- Line between bottom nodes -->
  <rect x="6" y="10" width="4" height="1"/>
</svg>
