<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="white">
  <!-- Gear teeth top -->
  <rect x="6" y="0" width="4" height="2"/>
  <!-- Gear teeth right -->
  <rect x="14" y="6" width="2" height="4"/>
  <!-- Gear teeth bottom -->
  <rect x="6" y="14" width="4" height="2"/>
  <!-- Gear teeth left -->
  <rect x="0" y="6" width="2" height="4"/>
  <!-- Gear teeth top-right -->
  <rect x="12" y="2" width="2" height="2"/>
  <!-- Gear teeth bottom-right -->
  <rect x="12" y="12" width="2" height="2"/>
  <!-- Gear teeth bottom-left -->
  <rect x="2" y="12" width="2" height="2"/>
  <!-- Gear teeth top-left -->
  <rect x="2" y="2" width="2" height="2"/>
  <!-- Gear body -->
  <rect x="4" y="3" width="8" height="1"/>
  <rect x="3" y="4" width="10" height="8"/>
  <rect x="4" y="12" width="8" height="1"/>
  <!-- Center hole -->
  <rect x="6" y="6" width="4" height="4" fill="black"/>
</svg>
